# Netlify deploys this Next.js app zero-config via its built-in OpenNext
# adapter (auto-detected — no [[plugins]] block needed here; pinning it is
# actively discouraged by Netlify's own docs, since auto-updates track
# Next.js compatibility). This file only needs to point at the one thing
# Netlify can't infer on its own: the scheduled function that replaces
# Vercel Cron (see netlify/functions/promote-schedules.mts).
[build]
  command = "npm run build"

# Next.js 16 requires Node >=20.9 (node_modules/next's own engines field).
# Pinned explicitly rather than relying on the account/site default, since
# that default has changed over time and differs by when a Netlify site was
# first created.
[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
