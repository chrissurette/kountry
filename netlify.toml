# Netlify deploys this Next.js app via its Next.js Runtime. Framework
# auto-detection never activated on this specific site (Build settings kept
# showing "Runtime: Not set" even after a fully successful `npm run build`,
# and the site 404'd on every path since nothing wired the build output into
# servable functions/routes). Two things were needed to fix it, both
# confirmed against real failed deploy logs on this project, not guessed:
# (1) the explicit [[plugins]] block below, forcing the runtime on
# regardless of auto-detection — requires the matching @netlify/plugin-nextjs
# devDependency in package.json (added unpinned, so Netlify keeps it current
# the same way auto-detection would have). (2) `publish = ".next"` — with no
# publish directory set (the zero-config-recommended default), it resolved
# to the base directory itself (`publish: /opt/build/repo` in the resolved
# config), which the plugin's own onBuild guard rejects with "Your publish
# directory cannot be the same as the base directory of your site." Setting
# it explicitly gives the plugin a valid starting point before it takes over
# and transforms the actual served output itself. This file also points at
# the one thing Netlify can't infer on its own: the scheduled function that
# replaces Vercel Cron (see netlify/functions/promote-schedules.mts).
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next.js 16 requires Node >=20.9 (node_modules/next's own engines field).
# Pinned explicitly rather than relying on the account/site default, since
# that default has changed over time and differs by when a Netlify site was
# first created.
[build.environment]
  NODE_VERSION = "24"
  # This is a public restaurant identifier, not a credential. Its value is
  # intentionally present in public asset names/URLs, so Netlify's literal
  # value scanner otherwise reports false positives. Keep scanning enabled for
  # every real secret and omit only this configuration key.
  SECRETS_SCAN_OMIT_KEYS = "SITE_RESTAURANT_SLUG"

[functions]
  directory = "netlify/functions"
